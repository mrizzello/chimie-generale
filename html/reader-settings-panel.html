<div id="reader-settings-panel" class="reader-settings-panel">
  <div class="reader-settings-row">
    <span>Taille</span>
    <span>
      <button type="button" data-reader-action="size-dec" aria-label="Diminuer la taille du texte">A-</button>
      <button type="button" data-reader-action="size-inc" aria-label="Augmenter la taille du texte">A+</button>
    </span>
  </div>
  <div class="reader-settings-row">
    <span>Police</span>
    <span>
      <button type="button" data-reader-font="serif">Serif</button>
      <button type="button" data-reader-font="sans">Sans</button>
    </span>
  </div>
  <div class="reader-settings-row">
    <span>Thème</span>
    <span>
      <button type="button" data-reader-theme="white">Blanc</button>
      <button type="button" data-reader-theme="sepia">Sépia</button>
      <button type="button" data-reader-theme="night">Nuit</button>
    </span>
  </div>
  <div class="reader-settings-row">
    <span>Interligne</span>
    <span>
      <button type="button" data-reader-action="spacing-dec" aria-label="Réduire l'interlignage">-</button>
      <button type="button" data-reader-action="spacing-inc" aria-label="Augmenter l'interlignage">+</button>
    </span>
  </div>
</div>
