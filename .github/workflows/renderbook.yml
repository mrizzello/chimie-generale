on:
  push:
    branches: [main, master]

name: render-book

jobs:
  quarto:
    name: Render Quarto Book
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v3
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Pin tlmgr to the same TeX Live snapshot as local (2026-08-05)
        run: |
          tlmgr option repository https://www.texlive.info/tlnet-archive/2026/08/05/tlnet
          tlmgr update --self --all
      - name: Install latex packages
        run: tlmgr install tcolorbox tabto-ltx booktabs amscls cancel was gensymb mhchem siunitx exercise needspace fancyhdr tools
      - name: Render book with Quarto
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: _book
          path: _book/
  
  checkout-and-deploy:
   runs-on: ubuntu-latest
   needs: quarto
   steps:
     - name: Checkout
       uses: actions/checkout@v3
     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
         # Artifact name
         name: _book # optional
         # Destination path
         path: _book # optional
     - name: Deploy site to gh-pages
       uses: JamesIves/github-pages-deploy-action@4.1.5
       with:
         branch: gh-pages
         folder: _book
