on:
  push:
    branches: [main, master]

name: render-book

jobs:
  quarto:
    name: Render Quarto Book
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '1.10.18'
          tinytex: true
      - name: Update TeX Live to latest (same as local)
        run: |
          tlmgr update --self --all
          tlmgr --version
          tlmgr info --only-installed texlive-scripts | grep -i revision
      - name: Install latex packages
        run: tlmgr install tcolorbox tabto-ltx booktabs amscls cancel was gensymb mhchem siunitx exercise needspace fancyhdr tools
      - name: Render book with Quarto
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: _book
          path: _book/
  
  checkout-and-deploy:
   runs-on: ubuntu-latest
   needs: quarto
   steps:
     - name: Checkout
       uses: actions/checkout@v5
     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
         # Artifact name
         name: _book # optional
         # Destination path
         path: _book # optional
     - name: Deploy site to gh-pages
       uses: JamesIves/github-pages-deploy-action@4.1.5
       with:
         branch: gh-pages
         folder: _book
