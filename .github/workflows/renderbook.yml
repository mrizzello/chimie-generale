on:
  push:
    branches: [main, master]

name: renderbook

jobs:
  bookdown:
    name: Render-Book
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.3'
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.7'
      - name: Install R packages (pinned to local versions)
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_version("knitr", version = "1.51", upgrade = "never")'
          Rscript -e 'remotes::install_version("rmarkdown", version = "2.31", upgrade = "never")'
          Rscript -e 'remotes::install_version("bookdown", version = "0.47", upgrade = "never")'
          Rscript -e 'remotes::install_version("tinytex", version = "0.60", upgrade = "never")'
      - name: Install tinytex
        run: Rscript -e 'tinytex::install_tinytex()'
      - name: Pin tlmgr to the same TeX Live snapshot as local (2026-08-05)
        run: |
          tlmgr option repository https://www.texlive.info/tlnet-archive/2026/08/05/tlnet
          tlmgr update --self --all
      - name: Install latex packages
        run: tlmgr install tcolorbox tabto-ltx booktabs amscls cancel was mhchem siunitx exercise needspace fancyhdr tools
      - name: Render Book
        run: Rscript -e 'bookdown::render_book("index.Rmd")'
      - uses: actions/upload-artifact@v4
        with:
          name: _book
          path: _book/
  
  checkout-and-deploy:
   runs-on: ubuntu-latest
   needs: bookdown
   steps:
     - name: Checkout
       uses: actions/checkout@master
     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
         # Artifact name
         name: _book # optional
         # Destination path
         path: _book # optional
     - name: Deploy Gitbook to gh-pages
       uses: JamesIves/github-pages-deploy-action@4.1.5
       with:
         branch: gh-pages
         folder: _book
